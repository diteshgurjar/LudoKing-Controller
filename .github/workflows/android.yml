name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build both modules
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload LudoKing APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-updated-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload LudoController APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoController-debug-apk
          path: controller-app/build/outputs/apk/debug/*.apk
